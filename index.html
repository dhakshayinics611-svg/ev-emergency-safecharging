/* Layout: one column on phones; simulator splits into scene + controls from 760px up, station cards go two across. */

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.kicker {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}
header { display: flex; flex-direction: column; gap: 10px; padding-block: 4px 0; }
header p { color: var(--muted); max-width: 62ch; }
.note {
  font-size: 0.85rem;
  color: var(--muted);
  border-left: 2px solid var(--line);
  padding-left: 10px;
  max-width: 62ch;
}

.panel-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sim-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.scene { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--sky); min-width: 0; }
.scene svg { display: block; width: 100%; height: auto; max-width: 100%; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.banner {
  display: flex; flex-direction: column; gap: 2px;
  padding: 12px 14px; border-radius: 10px;
  background: var(--ok-bg); color: var(--ok);
}
.banner strong { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
.banner span { font-size: 0.9rem; color: var(--fg); }
[data-state=&quot;rain&quot;] .banner { background: var(--warn-bg); color: var(--warn); }
[data-state=&quot;flood&quot;] .banner, [data-state=&quot;lock&quot;] .banner { background: var(--bad-bg); color: var(--bad); }

.controls { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row label, .row .lbl { font-weight: 500; }
.row .sub { display: block; font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.switch {
  appearance: none; border: 1px solid var(--line); background: var(--surface-2);
  width: 52px; height: 30px; border-radius: 999px; position: relative; cursor: pointer; flex: none;
  transition: background 0.2s, border-color 0.2s;
}
.switch::after {
  content: &quot;&quot;; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--muted); transition: transform 0.2s, background 0.2s;
}
.switch[aria-checked=&quot;true&quot;] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked=&quot;true&quot;]::after { transform: translateX(22px); background: var(--accent-fg); }
input[type=&quot;range&quot;] { width: 100%; accent-color: var(--accent); height: 28px; margin: 0; }
.pct { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600; cursor: pointer;
  border-radius: 8px; padding: 9px 16px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.signals { display: flex; flex-direction: column; margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.signals &gt; div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; font-size: 0.88rem; }
.signals &gt; div + div { border-top: 1px solid var(--line); }
.signals dt { color: var(--muted); }
.signals dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; min-width: 0; }
.signals-title { display: flex; flex-direction: column; gap: 2px; }
.signals-title span { font-size: 0.82rem; color: var(--muted); }

/* scene colours and motion */
.sky { fill: var(--sky); }
.ground { fill: var(--ground); }
.body { fill: var(--station); }
.hood { fill: var(--panel); }
.sock { fill: var(--socket); }
.pin { fill: var(--panel); }
.cover { fill: var(--cover); transform-box: fill-box; transform-origin: top; transform: scaleY(0.12); transition: transform 0.6s ease; }
[data-rain=&quot;true&quot;] .cover { transform: scaleY(1); }
.lamp { fill: var(--ok); }
[data-state=&quot;rain&quot;] .lamp { fill: var(--warn); }
[data-state=&quot;flood&quot;] .lamp, [data-state=&quot;lock&quot;] .lamp { fill: var(--bad); }
[data-state=&quot;flood&quot;] .lamp { animation: blink 0.8s steps(2, jump-none) infinite; }
.water { fill: var(--water); opacity: 0.6; transition: y 0.2s linear, height 0.2s linear; }
.thr { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.thr-t { fill: var(--muted); font: 500 10px var(--font-mono); paint-order: stroke; stroke: var(--sky); stroke-width: 3px; }
.cloud { fill: var(--rain); opacity: 0; transition: opacity 0.4s; }
.rain { opacity: 0; transition: opacity 0.4s; }
[data-rain=&quot;true&quot;] .cloud { opacity: 0.55; }
[data-rain=&quot;true&quot;] .rain { opacity: 1; }
.drop { stroke: var(--rain); stroke-width: 1.6; stroke-linecap: round; animation: fall 0.9s linear infinite; }
@keyframes fall { from { transform: translateY(-10px); } to { transform: translateY(190px); } }
@keyframes blink { 50% { opacity: 0.25; } }

/* dashboard */
.dash-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.dash-head p { color: var(--muted); font-size: 0.9rem; }
.filter { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
.card {
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface);
  display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card h3 { overflow-wrap: anywhere; }
.area { font-size: 0.82rem; color: var(--muted); }
.tag {
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--muted); white-space: nowrap; flex: none;
}
.tag.live { color: var(--accent); border-color: var(--accent); }
.chip {
  display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
  padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 0.85rem;
  background: var(--ok-bg); color: var(--ok);
}
.chip::before { content: &quot;&quot;; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.card[data-s=&quot;rain&quot;] .chip { background: var(--warn-bg); color: var(--warn); }
.card[data-s=&quot;flood&quot;] .chip { background: var(--bad-bg); color: var(--bad); }
.card .detail { font-size: 0.85rem; color: var(--muted); }
.count { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); text-align: center; }

/* signal chain */
.chain { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 0; padding: 0; list-style: none; }
.chain li { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-family: var(--font-mono); font-size: 0.8rem; }
.flow b { font-weight: 500; background: var(--surface-2); border-radius: 6px; padding: 3px 8px; }
.flow i { font-style: normal; color: var(--muted); }
.chain p { font-size: 0.88rem; color: var(--muted); }

@media (min-width: 760px) {
  .sim-grid { grid-template-columns: 1.15fr 1fr; align-items: start; }
  .cards { grid-template-columns: 1fr 1fr; }
  .chain { grid-template-columns: repeat(3, 1fr); }
  .panel-card { padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .drop, [data-state=&quot;flood&quot;] .lamp { animation: none; }
  .cover, .water, .switch, .switch::after { transition: none; }
}

    &lt;p class=&quot;note&quot;&gt;Station 1 follows the simulator above. Stations 2 to 4 are sample data. The filter hides stations with flood detected.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;panel-card&quot; aria-labelledby=&quot;how-h&quot;&gt;
    &lt;h2 id=&quot;how-h&quot;&gt;How the parts connect&lt;/h2&gt;
    &lt;ul class=&quot;chain&quot;&gt;
      &lt;li&gt;
        &lt;h3&gt;Rain protection&lt;/h3&gt;
        &lt;div class=&quot;flow&quot;&gt;&lt;b&gt;Rain sensor&lt;/b&gt;&lt;i&gt;→&lt;/i&gt;&lt;b&gt;Arduino&lt;/b&gt;&lt;i&gt;→&lt;/i&gt;&lt;b&gt;Servo&lt;/b&gt;&lt;/div&gt;
        &lt;p&gt;The servo turns to 90° and closes the cover over the socket.&lt;/p&gt;
      &lt;/li&gt;
      &lt;li&gt;
        &lt;h3&gt;Flood protection&lt;/h3&gt;
        &lt;div class=&quot;flow&quot;&gt;&lt;b&gt;Water sensor&lt;/b&gt;&lt;i&gt;→&lt;/i&gt;&lt;b&gt;Arduino&lt;/b&gt;&lt;i&gt;→&lt;/i&gt;&lt;b&gt;Relay + LED&lt;/b&gt;&lt;/div&gt;
        &lt;p&gt;Above 30% water the relay cuts power and the red LED warns people. Above 60% the station locks.&lt;/p&gt;
      &lt;/li&gt;
      &lt;li&gt;
        &lt;h3&gt;Status for drivers&lt;/h3&gt;
        &lt;div class=&quot;flow&quot;&gt;&lt;b&gt;Arduino&lt;/b&gt;&lt;i&gt;→&lt;/i&gt;&lt;b&gt;Server&lt;/b&gt;&lt;i&gt;→&lt;/i&gt;&lt;b&gt;App&lt;/b&gt;&lt;/div&gt;
        &lt;p&gt;Each station reports Safe, Rain with cover closed, or Flood detected.&lt;/p&gt;

&lt;script&gt;
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { rain: false, water: 0 };
  var onlySafe = false;
  var sim = $(&#x27;sim&#x27;);

  // rain drops
  var drops = $(&#x27;rainDrops&#x27;);
  var ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  for (var i = 0; i &lt; 18; i++) {
    var x = 10 + i * 17.5;
    var l = document.createElementNS(ns, &#x27;line&#x27;);
    l.setAttribute(&#x27;class&#x27;, &#x27;drop&#x27;);
    l.setAttribute(&#x27;x1&#x27;, x); l.setAttribute(&#x27;x2&#x27;, x - 3);
    l.setAttribute(&#x27;y1&#x27;, 40 + (i % 4) * 8); l.setAttribute(&#x27;y2&#x27;, 52 + (i % 4) * 8);
    l.style.animationDelay = (-(i * 0.17) % 0.9).toFixed(2) + &#x27;s&#x27;;
    l.style.animationDuration = (0.8 + (i % 3) * 0.12).toFixed(2) + &#x27;s&#x27;;
    drops.appendChild(l);
  }

  function compute() {
    var w = Math.round(state.water);
    if (w &gt;= 60) return { key: &#x27;lock&#x27;, card: &#x27;flood&#x27;, label: &#x27;Flood, do not use&#x27;, note: &#x27;Power is cut and the station is locked.&#x27;, relay: false, led: &#x27;RED&#x27; };
    if (w &gt;= 30) return { key: &#x27;flood&#x27;, card: &#x27;flood&#x27;, label: &#x27;Flood warning&#x27;, note: &#x27;Water at the base. Relay cut the power, red light is blinking.&#x27;, relay: false, led: &#x27;RED (blinking)&#x27; };
    if (state.rain) return { key: &#x27;rain&#x27;, card: &#x27;rain&#x27;, label: &#x27;Rain, cover closed&#x27;, note: &#x27;Socket is protected. Charging is still available.&#x27;, relay: true, led: &#x27;AMBER&#x27; };
    return { key: &#x27;safe&#x27;, card: &#x27;safe&#x27;, label: &#x27;Safe to charge&#x27;, note: &#x27;Cover open, power on, green light.&#x27;, relay: true, led: &#x27;GREEN&#x27; };
  }

  var CHIP = { safe: &#x27;Safe to charge&#x27;, rain: &#x27;Rain, cover closed&#x27;, flood: &#x27;Flood detected&#x27; };
  var DETAIL = {
    safe: &#x27;All sensors normal.&#x27;,
    rain: &#x27;Socket protected. Charging available.&#x27;,
    flood: &#x27;Power cut. Avoid this station.&#x27;
  };
  var stations = [
    { name: &#x27;Station 1&#x27;, area: &#x27;Raghuvanahalli&#x27;, live: true },
    { name: &#x27;Station 2&#x27;, area: &#x27;Kanakapura Road&#x27;, s: &#x27;safe&#x27; },
    { name: &#x27;Station 3&#x27;, area: &#x27;Banashankari&#x27;, s: &#x27;flood&#x27; },
    { name: &#x27;Station 4&#x27;, area: &#x27;Konanakunte&#x27;, s: &#x27;rain&#x27; }
  ];

  function renderCards(liveCard) {
    var shown = 0, html = &#x27;&#x27;;
    stations.forEach(function (st) {
      var s = st.live ? liveCard : st.s;
      if (onlySafe &amp;&amp; s === &#x27;flood&#x27;) return;
      shown++;
      html += &#x27;&lt;article class=&quot;card&quot; data-s=&quot;&#x27; + s + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;card-top&quot;&gt;&lt;div&gt;&lt;h3&gt;&#x27; + st.name + &#x27;&lt;/h3&gt;&lt;div class=&quot;area&quot;&gt;&#x27; + st.area + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;span class=&quot;tag&#x27; + (st.live ? &#x27; live&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27; + (st.live ? &#x27;Live&#x27; : &#x27;Sample&#x27;) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;span class=&quot;chip&quot;&gt;&#x27; + CHIP[s] + &#x27;&lt;/span&gt;&#x27; +
        &#x27;&lt;div class=&quot;detail&quot;&gt;&#x27; + DETAIL[s] + &#x27;&lt;/div&gt;&lt;/article&gt;&#x27;;
    });
    $(&#x27;cards&#x27;).innerHTML = html || &#x27;&lt;div class=&quot;empty&quot;&gt;No safe stations right now. Turn off the filter to see all stations.&lt;/div&gt;&#x27;;
    $(&#x27;count&#x27;).textContent = &#x27;Showing &#x27; + shown + &#x27; of &#x27; + stations.length + &#x27; stations&#x27;;
  }

  function render() {
    var c = compute();
    var w = Math.round(state.water);
    sim.setAttribute(&#x27;data-state&#x27;, c.key);
    sim.setAttribute(&#x27;data-rain&#x27;, state.rain ? &#x27;true&#x27; : &#x27;false&#x27;);
    $(&#x27;rainSw&#x27;).setAttribute(&#x27;aria-checked&#x27;, state.rain ? &#x27;true&#x27; : &#x27;false&#x27;);
    $(&#x27;water&#x27;).value = w;
    $(&#x27;pct&#x27;).textContent = w + &#x27;%&#x27;;
    $(&#x27;stLabel&#x27;).textContent = c.label;
    $(&#x27;stNote&#x27;).textContent = c.note;
    var h = Math.round(w * 1.2);
    var wr = $(&#x27;waterRect&#x27;);
    wr.setAttribute(&#x27;y&#x27;, 200 - h);
    wr.setAttribute(&#x27;height&#x27;, h);
    $(&#x27;sRain&#x27;).textContent = state.rain ? &#x27;HIGH&#x27; : &#x27;LOW&#x27;;
    $(&#x27;sServo&#x27;).textContent = state.rain ? &#x27;90° · cover closed&#x27; : &#x27;0° · cover open&#x27;;
    $(&#x27;sWater&#x27;).textContent = w + &#x27;%&#x27;;
    $(&#x27;sRelay&#x27;).textContent = c.relay ? &#x27;ON · power flowing&#x27; : &#x27;OFF · power cut&#x27;;
    $(&#x27;sLed&#x27;).textContent = c.led;
    renderCards(c.card);
  }

  // demo
  var timer = null;
  function stopDemo() {
    if (timer) { clearInterval(timer); timer = null; }
    $(&#x27;demo&#x27;).textContent = &#x27;Play demo&#x27;;
  }
  function playDemo() {
    if (timer) { stopDemo(); return; }
    state.rain = false; state.water = 0; render();
    $(&#x27;demo&#x27;).textContent = &#x27;Stop demo&#x27;;
    var t = 0, phase = 0, mark = 0;
    timer = setInterval(function () {
      t += 120;
      if (phase === 0 &amp;&amp; t &gt;= 1200) { state.rain = true; phase = 1; }
      else if (phase === 1 &amp;&amp; t &gt;= 3000) { phase = 2; }
      else if (phase === 2) { state.water += 1.5; if (state.water &gt;= 70) { state.water = 70; mark = t; phase = 3; } }
      else if (phase === 3 &amp;&amp; t - mark &gt;= 2400) { phase = 4; }
      else if (phase === 4) { state.water -= 3; if (state.water &lt;= 0) { state.water = 0; mark = t; phase = 5; } }
      else if (phase === 5 &amp;&amp; t - mark &gt;= 1200) { state.rain = false; render(); stopDemo(); return; }
      render();
    }, 120);
  }

  $(&#x27;rainSw&#x27;).addEventListener(&#x27;click&#x27;, function () { stopDemo(); state.rain = !state.rain; render(); });
  $(&#x27;water&#x27;).addEventListener(&#x27;input&#x27;, function (e) { stopDemo(); state.water = +e.target.value; render(); });
  $(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;, function () { stopDemo(); state.rain = false; state.water = 0; render(); });
  $(&#x27;demo&#x27;).addEventListener(&#x27;click&#x27;, playDemo);
  $(&#x27;filterSw&#x27;).addEventListener(&#x27;click&#x27;, function () {
    onlySafe = !onlySafe;
    this.setAttribute(&#x27;aria-checked&#x27;, onlySafe ? &#x27;true&#x27; : &#x27;false&#x27;);
    render();
  });

  render();
})();
&lt;/script&gt;
